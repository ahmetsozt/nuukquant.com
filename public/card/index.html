:root{
  --color-page:#0B0B0B;
  --color-page-glow:#1B1B1B;
  --color-surface:#151515;
  --color-surface-hover:#1D1D1D;
  --color-line:#2A2A2A;
  --color-line-hover:#3C3C3C;
  --color-ink:#F2F2EF;
  --color-ink-muted:#8D8D89;
  --color-blue:#3D8BFF;
  --color-green:#5FAE4E;

  --font-ui:"Lato", -apple-system, "Segoe UI", Roboto, sans-serif;
  --text-ui:0.9375rem;
  --text-small:0.8125rem;

  --space-gutter:clamp(20px, 5vw, 32px);
  --space-stack:clamp(22px, 4vw, 32px);
  --radius-card:6px;
  --radius-control:14px;

  --duration-fast:150ms;
  --duration-flip:750ms;
  --ease-out-expo:cubic-bezier(0.16, 1, 0.3, 1);
}

*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark;background:var(--color-page)}
body{
  margin:0;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding-inline:var(--space-gutter);
  padding-block:max(40px, env(safe-area-inset-top)) max(40px, env(safe-area-inset-bottom));
  background:radial-gradient(110% 60% at 50% 0%, var(--color-page-glow) 0%, var(--color-page) 62%);
  color:var(--color-ink);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
main{width:100%;max-width:460px;display:grid;gap:var(--space-stack)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---- card ---- */
.card-stage{display:grid;gap:14px;justify-items:center}
.card{
  all:unset;
  display:block;
  width:100%;
  aspect-ratio:85 / 55;
  perspective:1400px;
  cursor:pointer;
  border-radius:var(--radius-card);
  -webkit-tap-highlight-color:transparent;
}
.card__inner{
  position:relative;
  display:block;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform var(--duration-flip) var(--ease-out-expo);
}
.card[aria-pressed="true"] .card__inner{transform:rotateY(180deg)}
.card__face{
  position:absolute;
  inset:0;
  display:block;
  overflow:hidden;
  border-radius:var(--radius-card);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:0 26px 48px -28px rgb(0 0 0 / 0.9), 0 10px 20px -12px rgb(0 0 0 / 0.7);
}
.card__face::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgb(255 255 255 / 0.05), inset 0 1px 0 rgb(255 255 255 / 0.07);
  pointer-events:none;
}
.card__face--back{transform:rotateY(180deg)}
.card__face svg{display:block;width:100%;height:100%}
.card:focus-visible{outline:2px solid var(--color-blue);outline-offset:6px}
@media (hover:hover){
  .card:hover .card__inner{transform:rotateX(4deg) rotateY(-7deg)}
  .card[aria-pressed="true"]:hover .card__inner{transform:rotateX(4deg) rotateY(173deg)}
}

.hint{
  margin:0;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--color-ink-muted);
  font-size:var(--text-small);
  letter-spacing:0.02em;
}
.hint svg{width:14px;height:14px}

/* ---- actions ---- */
.actions{display:grid;gap:10px}
.actions__row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  all:unset;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:54px;
  padding-inline:16px;
  border:1px solid var(--color-line);
  border-radius:var(--radius-control);
  background:var(--color-surface);
  color:var(--color-ink);
  font:700 var(--text-ui)/1.1 var(--font-ui);
  letter-spacing:0.01em;
  text-align:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform var(--duration-fast) ease, background-color var(--duration-fast) ease, border-color var(--duration-fast) ease;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{background:var(--color-surface-hover);border-color:var(--color-line-hover)}
.btn:active{transform:scale(0.98)}
.btn:focus-visible{outline:2px solid var(--color-blue);outline-offset:3px}
.btn--primary{background:var(--color-ink);border-color:var(--color-ink);color:var(--color-page)}
.btn--primary:hover{background:#FFFFFF;border-color:#FFFFFF}
.btn--site{color:var(--color-blue)}
.btn--whatsapp svg{color:var(--color-green)}
.btn--quiet{background:transparent;border-style:dashed;color:var(--color-ink-muted)}
.btn--quiet:hover{color:var(--color-ink)}

/* ---- QR dialog ---- */
.qr{
  width:min(360px, calc(100vw - 40px));
  padding:0;
  border:0;
  border-radius:22px;
  background:var(--color-surface);
  color:var(--color-ink);
  box-shadow:0 40px 90px -30px rgb(0 0 0 / 0.9), inset 0 0 0 1px var(--color-line);
}
.qr[open]{animation:qr-in 320ms var(--ease-out-expo)}
.qr::backdrop{background:rgb(0 0 0 / 0.72);backdrop-filter:blur(6px)}
.qr__body{display:grid;gap:18px;padding:24px;text-align:center}
.qr__tile{padding:22px;border-radius:14px;background:#FFFFFF}
.qr__tile svg{display:block;width:100%;height:auto}
.qr h2{margin:0;font-size:1.0625rem;font-weight:700}
.qr p{margin:-10px 0 0;color:var(--color-ink-muted);font-size:var(--text-small);line-height:1.5}
.qr form{margin:0}
.qr .btn{width:100%}
@keyframes qr-in{from{opacity:0;transform:translateY(14px) scale(0.98)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .card__inner{transition:none}
  .card:hover .card__inner{transform:none}
  .card[aria-pressed="true"]:hover .card__inner{transform:rotateY(180deg)}
  .qr[open]{animation:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<main>
  <h1 class="sr-only">Ahmet S. OZTURK, Founder, NUUK</h1>

  <section class="card-stage" aria-label="Business card">

<script>
  const card = document.querySelector(".card");
  card.addEventListener("click", () => {
    const showBack = card.getAttribute("aria-pressed") !== "true";
    card.setAttribute("aria-pressed", String(showBack));
    card.setAttribute(
      "aria-label",
      showBack ? "Business card, back. Activate to see the front." : "Business card, front. Activate to see the back."
    );
  });

  const qrDialog = document.querySelector(".qr");
  document.querySelector("[data-open-qr]").addEventListener("click", () => qrDialog.showModal());
  qrDialog.addEventListener("click", (event) => {
    if (event.target === qrDialog) qrDialog.close();
  });
</script>
